# DevSecOps Test-Pipeline für CapitalGuard AG
# Zweck: PoC für Build- und SAST-Automatisierung
# Erstellt: 20.06.2026

name: CapitalGuard DevSecOps Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        run: python liquidity_spread.py

  sast-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bandit scan
        run: |
          pip install bandit
          bandit -r . -f txt || true
